[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faithsift"
version = "0.3.0"
description = "FaithSift —— RAG 回答的句子级引用忠实性检测器:三分类判定 + 跨语言召回 + 多跳证据"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "FaithSift contributors"}]
keywords = ["rag", "hallucination", "citation", "faithfulness", "llm", "nli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 本地离线语义向量通道(--embedder local / --retriever hybrid|dense)。
# 不装也能 import faithsift、也能跑 heuristic 词法引擎(依赖隔离是硬要求)。
# fastembed 基于 onnxruntime,不引入 torch,比 sentence-transformers 轻得多。
semantic = ["fastembed>=0.3"]

[project.urls]
Homepage = "https://github.com/example/faithsift"
Issues = "https://github.com/example/faithsift/issues"

[project.scripts]
faithsift = "faithsift.cli:main"

[tool.setuptools.packages.find]
include = ["faithsift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
