[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citecheck"
version = "0.1.0"
description = "Sentence-level citation faithfulness checker for RAG answers (heuristic + LLM judge, bilingual zh/en)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
citecheck = "citecheck.cli:main"

[tool.setuptools.packages.find]
include = ["citecheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
